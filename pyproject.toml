# For pipx and pre-commit. The clone + symlink install needs none of this.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caltrop"
dynamic = ["version"]
description = "Fail CI when tests take shortcuts that coding agents like."
license = "MIT"
requires-python = ">=3.11"

[project.scripts]
caltrop = "caltrop:main"

[tool.hatch.version]
path = "caltrop"

# The wheel is one package: the script as caltrop/__init__.py, with the rules beside it (HERE).
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"caltrop" = "caltrop/__init__.py"
"sgconfig.yml" = "caltrop/sgconfig.yml"
"rules" = "caltrop/rules"
"utils" = "caltrop/utils"

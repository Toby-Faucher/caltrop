id: no-weak-result-assert.raises-body-py
valid:
  - "def test_a():\n    with pytest.raises(ValueError):\n        f()"
  - "def test_a():\n    with pytest.raises(ValueError):\n        # the call under test\n        f()"
  - "def test_a():\n    x = setup()\n    with pytest.raises(ValueError):\n        f(x)\n    assert x.closed"
  - "def test_a():\n    with pytest.raises(ValueError):\n        @deco\n        def g():\n            pass"
  - "def test_a():\n    with pytest.raises(StopIteration):\n        for _ in it:\n            pass"
  - "def test_a():\n    with pytest.raises(StopIteration):\n        for _ in it:\n            ..."
  - "def test_a():\n    with pytest.raises(ValueError):\n        with open(p) as fh:\n            parse(fh)"
  - "def test_a():\n    with pytest.raises(ValueError), open(p) as fh:\n        parse(fh)"
  - "async def test_a():\n    with pytest.raises(ValueError):\n        async with client() as c:\n            await c.get('/')"
  - "def test_a():\n    with pytest.warns(UserWarning):\n        f()\n        g()"
  - "def test_a():\n    with open(p) as fh:\n        f()\n        g()"
invalid:
  - "def test_a():\n    with pytest.raises(ValueError):\n        x = setup()\n        f(x)"
  - "def test_a():\n    with pytest.raises(ValueError, match='bad'):\n        f()\n        assert False"
  - "def test_a():\n    with raises(ValueError):\n        f()\n        g()"
  - "def test_a(self):\n    with self.assertRaises(ValueError):\n        f()\n        g()"
  - "def test_a(self):\n    with self.assertRaisesRegex(ValueError, 'bad'):\n        f()\n        g()"
  - "def test_a():\n    with pytest.raises(ValueError) as e:\n        if x:\n            f()"
  - "def test_a():\n    with pytest.raises(ValueError):\n        for i in xs:\n            f(i)"
  - "def test_a():\n    with pytest.raises(ValueError):\n        with open(p) as fh:\n            data = fh.read()\n            parse(data)"
  - "async def test_a():\n    with pytest.raises(ValueError):\n        async with client() as c:\n            await c.login()\n            await c.get('/')"
  - "def test_a():\n    with pytest.raises(ValueError):\n        try:\n            f()\n        finally:\n            g()"

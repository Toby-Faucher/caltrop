id: no-mock-libs-py
valid:
  - "from unittest.mock import sentinel"
  - "import unittest"
  - "from mockito_like import thing"
  - "import mockingbird"
  - "def test_a(monkeypatch):\n    monkeypatch.setenv('X', '1')"
  - "def test_a(monkeypatch, tmp_path):\n    monkeypatch.chdir(tmp_path)"
  - "def test_a(monkeypatch):\n    monkeypatch.syspath_prepend('x')"
  - "def test_a(httpserver):\n    httpserver.expect_request('/x').respond_with_json({})"
  - "def mock_data():\n    return {}"
  - "def test_a(mocker):\n    mocker.patch.dict(os.environ, {'HTTP_PROXY': url})"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(app, 'MAX_EMAILS_PER_CYCLE', 3)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr('pkg.mod.LIMIT', 3)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(config, 'API_URL', 'http://localhost:1')"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(config, 'DEBUG', True, raising=False)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(config, 'TOKEN', None)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(config, 'TIMEOUT_S', -1.5)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(config, 'HOSTS', ('a', 'b'))"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr('pkg.mod.LIMITS', {'x': [1, 2], 'y': None})"
invalid:
  - "from unittest.mock import MagicMock, patch"
  - "from unittest import mock"
  - "from unittest import TestCase, mock"
  - "import unittest.mock"
  - "import mock"
  - "from mock import patch"
  - "def test_a():\n    from unittest.mock import patch"
  - "def test_a(mocker):\n    mocker.patch('app.send')"
  - "def test_a(mocker):\n    mocker.patch.object(app, 'send')"
  - "def test_a(mocker):\n    spy = mocker.spy(app, 'send')"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(app, 'send', lambda *a: None)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr('app.mailer.send', fake)"
  - "def test_a(mocker):\n    mocker.patch.dict(app.config, {'DEBUG': True})"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(app, 'SENDER', lambda *a: None)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(app, 'CLIENT', FakeMailer())"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr('pkg.mod.CLOCK', fake_clock)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(app, 'HANDLERS', [fake_handler])"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(app, 'Limit', 3)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr('pkg.mod.limit', 3)"
  - "def test_a(monkeypatch):\n    monkeypatch.setattr(app, 'URL', f'http://{host}')"

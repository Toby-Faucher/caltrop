id: no-silent-skip-py
valid:
  - "def helper():\n    if not shutil.which('git'):\n        return None"
  - "def test_a():\n    def helper(p):\n        if not os.path.exists(p):\n            return\n    helper('x')"
  - "def test_a():\n    if not os.path.exists(p):\n        pytest.fail(f'missing {p}')"
  - "def test_a():\n    if n > 3:\n        return"
  - "def test_a():\n    if result is None:\n        return"
  - "def test_a():\n    try:\n        import foo\n    except ImportError:\n        raise AssertionError('install foo')"
  - "def test_a():\n    try:\n        run()\n    except ValueError:\n        return"
  - "@pytest.mark.skip\ndef test_a():\n    pass"
  - "def test_a():\n    if shutil.which('git'):\n        run()\n        return"
  - "def test_a():\n    if not shutil.which('git'):\n        run()\n    else:\n        return"
  - "def test_a():\n    if not shutil.which('git'):\n        def later():\n            return 1"
invalid:
  - "def test_a():\n    if not shutil.which('git'):\n        if not os.path.exists(p):\n            return"
  - "def test_a():\n    try:\n        import foo\n    except ImportError:\n        if not os.path.exists(p):\n            return"
  - "@pytest.mark.skipif(not shutil.which('git'), reason='no git')\ndef test_a():\n    pass"
  - "@unittest.skipUnless(HAS_DB, 'no db')\ndef test_a():\n    pass"
  - "pytestmark = pytest.mark.skipif(sys.platform == 'win32', reason='x')"
  - "def test_a():\n    if not shutil.which('git'):\n        pytest.skip('no git')"
  - "np = pytest.importorskip('numpy')"
  - "try:\n    import foo\nexcept ImportError:\n    pytest.skip('no foo', allow_module_level=True)"
  - "class T(unittest.TestCase):\n    def test_a(self):\n        if not HAS_DB:\n            self.skipTest('no db')"
  - "def test_a():\n    if not shutil.which('git'):\n        return"
  - "def test_a():\n    if not os.path.exists(FIXTURE):\n        print('skip')\n        return"
  - "def test_a():\n    if 'API_KEY' not in os.environ:\n        return"
  - "async def test_a():\n    if os.getenv('DB_URL') is None:\n        return"
  - "def test_a():\n    if not docker_available():\n        return"
  - "def test_a():\n    try:\n        import foo\n    except ImportError:\n        return"
  - "def test_a():\n    try:\n        import foo\n    except (ImportError, OSError):\n        return"

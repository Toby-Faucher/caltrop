id: no-stubbed-gate-py
valid:
  # The override returns a user: the real routes run with that user.
  - "def test_a():\n    app.dependency_overrides[get_current_user] = lambda: User(role='viewer')\n    assert client.post('/x').status_code == 403"
  - "def _as_viewer():\n    return User(role='viewer')\n\ndef test_a():\n    app.dependency_overrides[get_current_user] = _as_viewer\n    assert client.post('/x').status_code == 403"
  # A real gate that checks something before it raises is not a stub.
  - "def _gate(user=Depends(get_current_user)):\n    if not user.is_admin:\n        raise HTTPException(status_code=403)\n    return user\n\ndef test_a():\n    app.dependency_overrides[require_admin] = _gate\n    assert client.post('/x').status_code == 403"
  # A raising stub for another error, to test the error handler: not an auth gate.
  - "def _db_down():\n    raise HTTPException(status_code=503)\n\ndef test_a():\n    app.dependency_overrides[get_db] = _db_down\n    assert client.get('/x').status_code == 503"
  # A raising stub in a test that asserts something other than the status the stub raised.
  - "def _reject():\n    raise HTTPException(status_code=403, detail='no')\n\ndef test_a():\n    app.dependency_overrides[require_admin] = _reject\n    assert client.get('/public').status_code == 200"
  - "def _reject():\n    raise HTTPException(status_code=403, detail='no')\n\ndef test_a():\n    app.dependency_overrides[require_admin] = _reject\n    assert client.post('/x').json() == {'error': 'no'}"
  # Same name, but the raising def is not the override.
  - "def test_a():\n    app.dependency_overrides[require_admin] = _allow\n    assert client.post('/x').status_code == 403\n\ndef _other():\n    raise HTTPException(status_code=403)"
  - "def test_a():\n    with pytest.raises(HTTPException):\n        raise HTTPException(status_code=403)\n    assert True"

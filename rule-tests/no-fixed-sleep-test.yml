id: no-fixed-sleep
valid:
  - "fn t() { std::thread::sleep(d); }"
  - "#[cfg(test)] mod tests { fn t() { loop { std::thread::sleep(d); } } }"
  - "#[cfg(test)] mod tests { fn t() { while x { sleep(d); } } }"
  - "#[cfg(test)] mod tests { fn t() { for i in 0..3 { std::thread::sleep(d); } } }"
  - "#[cfg(test)] mod tests { fn t() { let sleep = 3; } }"
  - "#[cfg(all(not(test), unix))] mod real { fn t() { std::thread::sleep(d); } }"
  - "#[cfg(test)] fn helper() {} fn real() { std::thread::sleep(d); }"
  - "fn real() { tokio::select! { _ = tokio::time::sleep(d) => {} } }"
  - "#[cfg(test)] mod tests { fn t() { assert!(sleep_count == 2); } }"
  - "#[cfg(test)] mod tests { fn t() { loop { tokio::select! { _ = sleep(d) => {} } } } }"
invalid:
  - "#[cfg(test)] mod tests { #[test] fn t() { std::thread::sleep(d); } }"
  - "#[cfg(test)] mod tests { async fn t() { tokio::time::sleep(d).await; } }"
  - "#[cfg(test)] mod tests { async fn t() { sleep(d).await; } }"
  - "#[cfg(test)] mod tests { async fn t() { while x { tokio::spawn(async move { loop { x().await; } sleep(d).await }); } } }"
  - "#[cfg(test)]\n#[allow(dead_code)]\nmod tests { fn t() { std::thread::sleep(d); } }"
  - "#[cfg(test)]\n/// Tests.\nmod tests { fn t() { std::thread::sleep(d); } }"
  - "#[cfg(all(test, unix))] mod tests { fn t() { std::thread::sleep(d); } }"
  - "#[cfg(all(unix, test))] mod tests { fn t() { std::thread::sleep(d); } }"
  - "#[test] fn t() { std::thread::sleep(d); }"
  - "#[tokio::test(flavor = \"multi_thread\")] async fn t() { tokio::time::sleep(d).await; }"
  - "#[cfg(test)] fn helper() { std::thread::sleep(d); }"
  - "#[cfg(test)] mod tests { async fn t() { tokio::select! { _ = tokio::time::sleep(d) => {} } } }"

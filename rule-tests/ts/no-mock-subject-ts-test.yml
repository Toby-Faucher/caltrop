id: no-mock-subject-ts
valid:
  - "vi.mock(modulePath);"
  - "vi.unmock('./toast');"
  - "const real = await vi.importActual('./toast');"
  - "vi.mocked(addToast).mockClear();"
  - "vi.stubGlobal('fetch', f);"
invalid:
  - "vi.mock('$lib/stores/toast.svelte', () => ({ addToast: (m) => m }));"
  - "jest.mock('./toast');"
  - "vi.doMock(\"../api\", () => ({ get: vi.fn() }));"
  - "jest.unstable_mockModule('./db.js', () => ({ query: jest.fn() }));"

id: no-fixed-sleep-ts
valid:
  - "await new Promise((r) => setTimeout(r, 0));"
  - "await new Promise((r) => setTimeout(r));"
  - "for (const x of xs) { await new Promise((r) => setTimeout(r, 5)); }"
  - "while (!done) { await sleep(10); }"
  - "setTimeout(() => server.close(), 50);"
  - "await new Promise((resolve, reject) => { server.on('ready', resolve); setTimeout(reject, 1000); });"
  - "const sleep = (ms) => new Promise((r) => setTimeout(r, ms));"
  - "function delay(ms: number) { return new Promise((r) => setTimeout(r, ms)); }"
  - "vi.advanceTimersByTime(1000);"
  - "await vi.advanceTimersByTimeAsync(100);"
  - "await waitFor(() => expect(x).toBe(1));"
  - "await wait(page);"
  - "await delay(fn);"
  - "await wait(items);"
  - "await wait(frames);"
  - "await sleep(0);"
  - "wait('ready', 5);"
  - "await user.click(button, { delay: 100 });"
  - "await setTimeout(0);"
  - "vi.useFakeTimers(); const p = new Promise((r) => setTimeout(r, 1000)); vi.advanceTimersByTime(1000); await p;"
  - "beforeEach(() => { vi.useFakeTimers(); }); it('x', async () => { const p = sleep(500); await vi.advanceTimersByTimeAsync(500); await p; });"
  - "jest.useFakeTimers(); it('x', async () => { const p = delay(ms); jest.advanceTimersByTime(ms); await p; });"
invalid:
  - "await new Promise(r => setTimeout(r, 5));"
  - "await new Promise((r) => setTimeout(r, 150));"
  - "await new Promise<void>((resolve) => setTimeout(resolve, ms));"
  - "await new Promise((resolve) => { setTimeout(resolve, 10); });"
  - "await new Promise(function (resolve) { setTimeout(resolve, 10); });"
  - "await new Promise((resolve) => setTimeout(() => resolve(), 10));"
  - "await new Promise((r) => window.setTimeout(r, 5));"
  - "await sleep(100);"
  - "await delay(ms);"
  - "await wait(TIMEOUT);"
  - "await page.waitForTimeout(500);"
  - "await setTimeout(100);"
  - "await sleep(5 * 1000);"
  - "await sleep(DEBOUNCE_MS);"
  - "await sleep(retryDelayMs);"
  - "await sleep(poll_interval);"
  - "it('x', async () => { for (const n of ns) { pool.run(async () => { await sleep(5); }); } });"
  - "await mapPool(xs, 3, async (n) => { await new Promise((r) => setTimeout(r, 5)); return n; });"
  - "vi.useRealTimers(); await sleep(100);"

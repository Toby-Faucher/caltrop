id: no-ignored-test-ts
valid:
  - "it('runs', () => {});"
  - "describe('suite', () => { it('x', () => {}); });"
  - "test.skip(process.env.CI === 'true', 'needs a display');"
  - "test.skip(({ browserName }) => browserName === 'webkit', 'flaky on webkit');"
  - "it.skipIf(!hasDb)('x', () => {});"
  - "const q = db.skip(10);"
  - "cursor.skip(5).limit(2);"
  - "it.only('x', () => {});"
  - "steps.skip('reason');"
  - "expect(() => parse('x')).toThrow(SyntaxError);"
  - "t.fail('unreachable');"
  - "assert.fail('unreachable');"
  - "expect.fail('unreachable');"
  - "const failing = results.failing();"
  - "it('fails on bad input', () => { expect(() => f(1)).toThrow(); });"
invalid:
  - "it.skip('x', () => {});"
  - "test.skip('x', async () => {});"
  - "describe.skip('suite', function () {});"
  - "it.todo('handles errors');"
  - "test.todo('later');"
  - "xit('x', () => {});"
  - "xdescribe('x', () => {});"
  - "xtest('x', () => {});"
  - "it.skip.each([1, 2])('x %i', (n) => {});"
  - "test.describe.skip('x', () => {});"
  - "test.fixme('x', async ({ page }) => {});"
  - "test.skip();"
  - "it.concurrent.skip('x', async () => {});"
  - "it.skip('x', { timeout: 5 }, () => {});"
  - "test.fails('x', () => { expect(add(1, 1)).toBe(3); });"
  - "it.fails('x', async () => {});"
  - "test.failing('x', () => {});"
  - "it.failing.each([1, 2])('x %i', (n) => {});"
  - "test.concurrent.fails('x', async () => {});"
  - "test.fail('x', async ({ page }) => {});"
  - "test.fail();"
  - "test.fail(browserName === 'webkit', 'bug 123');"

id: no-deadline-poll
valid:
  - "fn t() { loop { std::thread::sleep(d); } }"
  - "#[cfg(test)] mod tests { fn t() { std::thread::sleep(d); } }"
  - "#[cfg(test)] mod tests { async fn t() { loop { tokio::spawn(async move { sleep(d).await }); } } }"
invalid:
  - "#[cfg(test)] mod tests { fn t() { while x { sleep(d); } } }"
  - "#[cfg(test)] mod tests { fn t() { loop { std::thread::sleep(d); } } }"
  - "#[cfg(test)] mod tests { fn t() { for i in 0..3 { thread::sleep(d); } } }"

id: no-test-swap
valid:
  - '#[cfg(feature = "fakeroot")] fn f() {}'
  - '#[cfg(feature = "stubborn")] fn f() {}'
  - '#[cfg(feature = "latest-api")] fn f() {}'
  - '#[cfg(feature = "contest")] fn f() {}'
  - '#[cfg(test)] mod tests { fn t() { if cfg!(feature = "test-push") {} } }'
  - "#[cfg(test)] mod tests { fn t() { if cfg!(test) {} } }"
  - "#[cfg(test)] mod tests {}"
  - '#[cfg(feature = "x")] fn f() {}'
  - "#[cfg(test)] fn helper() { if cfg!(test) {} }"
  - "#[cfg(test)]\n#[allow(dead_code)]\nmod tests { fn t() { if cfg!(test) {} } }"
  - "#[cfg(all(test, unix))] mod tests { fn t() { if cfg!(test) {} } }"
invalid:
  - '#[cfg(feature = "net_mock")] fn f() {}'
  - '#[cfg(any(\n  unix,\n  feature = "test-support"\n))] fn f() {}'
  - '#[cfg(feature = "testing")] fn f() {}'
  - 'fn f() { if cfg!(feature = "test-utils") {} }'
  - 'fn f() { let allow = cfg!(feature = "test-push"); }'
  - '#[cfg(feature = "test-support")] pub mod testing {}'
  - '#[cfg(any(test, feature = "mock-net"))] fn fake() {}'
  - 'fn f() { if cfg!(feature = "fake_clock") {} }'
  - "fn f() { if cfg!(test) { a() } else { b() } }"
  - "fn f() { if cfg!(not(test)) {} }"
  - "#[cfg(not(test))] fn real() {}"
  - "#[cfg(all(not(test), unix))] fn real() {}"
  - "fn f() { if cfg!(all(test, unix)) {} }"
  - "fn f() { if cfg!(any(test, feature = \"x\")) {} }"
  - "#[cfg(any(not(test), unix))] fn real() {}"

name: Missed shortcut
description: A test shortcut that caltrop does not flag.
labels: ["enhancement"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Python
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Code
      description: The smallest snippet with the shortcut, with its file path.
      render: text
    validations:
      required: true
  - type: textarea
    id: shortcut
    attributes:
      label: What shortcut it is
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: What caltrop should say
      description: The fix the message should point the agent to.
    validations:
      required: true

id: no-fake-impls
language: rust
severity: error
message: "Use the real implementation. A hand-written fake that stands in for a trait is a mock. A real local server on a socket is fine."
rule:
  kind: impl_item
  has:
    field: type
    regex: '^(Mock|Fake|Stub|Spy|Dummy)([A-Z_0-9<]|$)'
  all:
    - has:
        field: trait
        regex: '.'
    - not:
        has:
          field: trait
          regex: '(^|::)((Drop|Debug|Display|Clone|Default|PartialEq|Eq|Hash|Send|Sync|Error)$|From<)'

# Generated from rules/ts/no-mock-libs-ts.yml by scripts/gen-tsx.py; edit that file and re-run.
id: no-mock-libs-tsx
language: tsx
severity: error
message: "Use the real implementation; pass dependencies in instead of replacing modules or globals. For HTTP, use a real local server or msw (it serves real Responses to the real fetch). A `vi.fn()` callback spy is fine."
rule:
  any:
    - kind: call_expression
      has:
        field: function
        regex: '^(vi|jest)\.(mock|doMock|unstable_mockModule|stubGlobal)$'
      not:
        any:
          # stubGlobal is only flagged for network globals; stubbing e.g. matchMedia for jsdom is fine.
          - all:
              - has: { field: function, regex: 'stubGlobal$' }
              - not:
                  has:
                    field: arguments
                    has: { nthChild: 1, regex: '^[''"`](fetch|XMLHttpRequest|WebSocket|EventSource)[''"`]$' }
          # SvelteKit: $env/* and $app/env/* (Kit 3) only set env vars; $app/* runtime modules need a running app (the router), so
          # unit tests must stub them. $lib/.. and other modules stay flagged.
          - has:
              field: arguments
              has:
                nthChild: 1
                regex: '^[''"`]\$(env/(dynamic|static)/(private|public)|app/(navigation|stores|state|forms|environment|paths|env(/(private|public))?))[''"`]$'
    - kind: assignment_expression
      all:
        - has: { field: left, regex: '^(global|globalThis|window)\.(fetch|XMLHttpRequest|WebSocket|EventSource)$' }
        - has: { field: right, regex: '^(vi|jest)\.fn\b|(?i:mock|fake|stub)' }
    # vi.spyOn(obj, 'm').mockReturnValue(..): first link of the chain only.
    - kind: call_expression
      has:
        field: function
        kind: member_expression
        all:
          - has:
              field: property
              regex: '^mock(Implementation|ReturnValue|ResolvedValue|RejectedValue)(Once)?$'
          - has:
              field: object
              kind: call_expression
              has: { field: function, regex: '^(vi|jest)\.spyOn$' }
              # Silencing console output swaps no behaviour under test.
              not: { has: { field: arguments, has: { nthChild: 1, regex: '^console$' } } }
      # A pass-through that records and calls the original (orig.call(this, ..)) swaps nothing.
      not:
        has: { field: arguments, regex: '\.(call|apply)\(\s*this\b' }
    # const s = vi.spyOn(o, 'm'); s.mockReturnValue(..) in the same block: the declaration, once per spy.
    - kind: variable_declarator
      all:
        - has: { field: name, pattern: $SPY }
        - has:
            field: value
            kind: call_expression
            all:
              - has: { field: function, regex: '^(vi|jest)\.spyOn$' }
              - not: { has: { field: arguments, has: { nthChild: 1, regex: '^console$' } } }
        - inside:
            kind: lexical_declaration
            inside:
              any: [ { kind: statement_block }, { kind: program } ]
              has:
                stopBy: end
                kind: call_expression
                all:
                  - has:
                      field: function
                      kind: member_expression
                      all:
                        - has: { field: object, pattern: $SPY }
                        - has:
                            field: property
                            regex: '^mock(Implementation|ReturnValue|ResolvedValue|RejectedValue)(Once)?$'
                  - not: { has: { field: arguments, regex: '\.(call|apply)\(\s*this\b' } }
    - kind: import_statement
      has:
        field: source
        regex: '^[''"](sinon|ts-mockito|@?testdouble|jest-mock-extended|vitest-mock-extended|jest-fetch-mock|vitest-fetch-mock|fetch-mock)([''"/])'

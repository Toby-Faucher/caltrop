# Generated from rules/ts/no-weak-result-assert-ts.yml by scripts/gen-tsx.py; edit that file and re-run.
id: no-weak-result-assert-tsx
language: tsx
severity: error
message: "Assert which error: pass the class, a message regex or a matcher, e.g. `toThrow(NotFoundError)`, `rejects.toThrow(/timed out/)`. A bare `toThrow()` passes on any error, including a TypeError from a typo."
files:
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/e2e/**"
rule:
  any:
    - kind: call_expression
      all:
        - has:
            field: function
            kind: member_expression
            all:
              - has: { field: property, regex: '^toThrow(Error)?$' }
              # .not.toThrow() asserts that nothing is thrown; that is precise.
              - not: { has: { field: object, kind: member_expression, has: { field: property, regex: '^not$' } } }
        - has: { field: arguments, not: { has: { nthChild: 1 } } }
    # node:assert with only the function or promise.
    - kind: call_expression
      all:
        - has: { field: function, regex: '^(assert\.)?(throws|rejects)$' }
        - has: { field: arguments, all: [ { has: { nthChild: 1 } }, { not: { has: { nthChild: 2 } } } ] }

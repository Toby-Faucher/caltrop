id: no-fixed-sleep-py
language: python
severity: error
message: "Await the operation or an event it emits (`asyncio.Event`, a queue, a future). To prove something did not happen, send a sentinel after it and wait for the sentinel. For timers or timestamps, inject the clock or freeze time (`time-machine`, `freezegun`)."
files:
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
  - "**/tests/**"
  - "**/test/**"
rule:
  # A delay inside a stand-in the code under test calls (a slow fake, a handler that never answers) simulates
  # latency; the test is not waiting on it.
  not:
    matches: py-in-stand-in
  any:
    - all:
        - matches: py-sleep-call
        - not:
            matches: py-in-loop
    # A callback on a fixed delay is a sleep too. call_later(0, cb) is call_soon. It never blocks, so loops don't matter.
    - kind: call
      has:
        field: function
        regex: '(^|\.)(loop|get_running_loop\(\)|get_event_loop\(\))\.call_later$'
      not:
        has:
          field: arguments
          has:
            nthChild: 1
            regex: '^0(\.0*)?$'

id: no-coverage-pragma-py
language: python
severity: error
message: "Cover this code with a test instead of excluding it from coverage. An excluded line lets a coverage threshold pass on code no test runs."
# Production code: that is where coverage exclusions live. Test code is skipped (same globs as the test rules):
# a coverage threshold protects the code under test, not the tests.
ignores:
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
  - "**/tests/**"
  - "**/test/**"
utils:
  # raise AssertionError(..) or assert False: a marker for code that must never run.
  unreachable:
    any:
      - { kind: raise_statement, regex: '^raise\s+AssertionError\b' }
      - { kind: assert_statement, regex: '^assert\s+(False|0)\b' }
rule:
  kind: comment
  # coverage.py's own default exclude (no cover) and partial-branch (no branch) regexes, 7.17.3 config.py.
  regex: '#\s*(pragma|PRAGMA)[:\s]?\s*(no|NO)\s*(cover|COVER|branch|BRANCH)'
  # Skipped: lines coverage.py already excludes by default, where the pragma changes nothing.
  not:
    any:
      # if TYPE_CHECKING:  # pragma: no cover
      - inside:
          kind: if_statement
          regex: '^if\s+(typing\.)?TYPE_CHECKING\s*:'
      # A stub whose body is only `...` (and a docstring): a Protocol or overload method.
      - inside:
          kind: function_definition
          stopBy: end
          has:
            field: body
            not:
              has:
                not:
                  any:
                    - kind: comment
                    - kind: expression_statement
                      regex: '(?s)^(\.\.\.|[rRuU]?("""|''''''|"|'').*)$'
      # An unreachable marker: `raise AssertionError(..)  # pragma: no cover`, or a block that only holds one
      # (`else:  # pragma: no cover` over `assert False`).
      - follows: { matches: unreachable }
      - inside:
          # Not on an `if` with an else/elif: the pragma would hide those branches too.
          not: { has: { field: alternative, any: [ { kind: else_clause }, { kind: elif_clause } ] } }
          has:
            kind: block
            not:
              has:
                not:
                  any:
                    - kind: comment
                    - matches: unreachable

id: no-weak-result-assert-py
language: python
severity: error
message: "Assert which error. Raise and catch the specific exception type (`pytest.raises(ValueError, match=..)`), not `Exception`, which passes on any bug. For `SystemExit` or `IntegrityError`, add `match=` or check `e.value` (the exit code, the constraint)."
files:
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
  - "**/tests/**"
  - "**/test/**"
rule:
  kind: call
  all:
    - has:
        field: function
        regex: '^(pytest\.raises|self\.assertRaises)$'
    - has:
        field: arguments
        has:
          nthChild: 1
          # SystemExit also covers exit code 0 and argparse usage errors; IntegrityError any constraint.
          regex: '^(builtins\.)?(Exception|BaseException|SystemExit)$|^([\w.]+\.)?(IntegrityError|DatabaseError)$'
    # A match= pattern still pins down the error.
    - not:
        has:
          field: arguments
          has:
            kind: keyword_argument
            regex: '^match\s*='
    # `with pytest.raises(Exception) as e:` then a later statement that reads `e.value` pins the error too.
    - not:
        inside:
          kind: with_statement
          stopBy: end
          has:
            kind: with_clause
            has:
              kind: with_item
              has:
                kind: as_pattern
                has:
                  field: alias
                  pattern: $E
          precedes:
            stopBy: end
            has:
              stopBy: end
              any:
                - pattern: $E.value
                - pattern: $E.exception

id: no-weak-result-assert-py
language: python
severity: error
message: "Assert which error. Raise and catch the specific exception type (`pytest.raises(ValueError, match=..)`), not `Exception`, which passes on any bug. For `SystemExit` or `IntegrityError`, add `match=` or check `e.value` (the exit code, the constraint)."
files:
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
  - "**/tests/**"
  - "**/test/**"
utils:
  reads-e:
    any:
      - pattern: $E.value
      - pattern: $E.exception
      - pattern: $E.type
      - pattern: $E.match($$$)
rule:
  kind: call
  all:
    - has:
        field: function
        regex: '^(pytest\.raises|self\.assertRaises)$'
    - has:
        field: arguments
        has:
          nthChild: 1
          # SystemExit also covers exit code 0 and argparse usage errors; IntegrityError any constraint.
          regex: '^(builtins\.)?(Exception|BaseException|SystemExit)$|^([\w.]+\.)?(IntegrityError|DatabaseError)$'
    # A match= pattern still pins down the error.
    - not:
        has:
          field: arguments
          has:
            kind: keyword_argument
            regex: '^match\s*='
    # `with pytest.raises(Exception) as e:` then a later statement that reads `e.value`, `e.type` or calls
    # `e.match(..)` pins the error too.
    - not:
        all:
          - inside:
              kind: with_statement
              stopBy: end
              has:
                kind: with_clause
                has:
                  kind: with_item
                  has:
                    kind: as_pattern
                    has:
                      field: alias
                      pattern: $E
          # The read may sit after an enclosing block (`async with client:`), but in the same function.
          - inside:
              stopBy: { kind: function_definition }
              not: { kind: function_definition }
              precedes:
                stopBy: end
                any:
                  - matches: reads-e
                  - has: { stopBy: end, matches: reads-e }

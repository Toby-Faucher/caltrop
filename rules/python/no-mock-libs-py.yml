id: no-mock-libs-py
language: python
severity: error
message: "Use the real implementation, not a mock or a patched attribute. Pass the dependency in. For HTTP, a real local server (`pytest-httpserver`, a uvicorn app on a free port) is fine. `monkeypatch.setenv`, `chdir` and `syspath_prepend` are fine."
utils:
  # A number, plain string, bool, None, or a tuple/list/set/dict built only from those.
  literal:
    any:
      - { kind: integer }
      - { kind: float }
      - { kind: string }
      - { kind: concatenated_string }
      - { kind: 'true' }
      - { kind: 'false' }
      - { kind: none }
      - { kind: unary_operator }
      - { kind: tuple }
      - { kind: list }
      - { kind: set }
      - { kind: dictionary }
    not:
      has:
        stopBy: end
        any: [ { kind: identifier }, { kind: interpolation }, { kind: lambda } ]
rule:
  any:
    - kind: import_statement
      regex: '^import\s+(unittest\.mock|mock|pytest_mock)\b'
    - kind: import_from_statement
      regex: '^from\s+(unittest\.mock|mock|pytest_mock)\b|^from\s+unittest\s+import\b[^#]*\bmock\b'
      # A sentinel is a marker object, not a mock.
      not:
        regex: '^from\s+(unittest\.mock|mock)\s+import\s+sentinel$'
    # pytest-mock: mocker.patch, mocker.patch.object, mocker.Mock, mocker.spy.
    - kind: call
      has:
        field: function
        regex: '^mocker\.'
      # Patching os.environ is setting env vars, like monkeypatch.setenv.
      not:
        all:
          - has:
              field: function
              regex: '^mocker\.patch\.dict$'
          - has:
              field: arguments
              has:
                nthChild: 1
                regex: '^os\.environ$'
    - kind: call
      has:
        field: function
        regex: '^monkeypatch\.setattr$'
      # Setting an ALL_CAPS module constant to a literal is configuration, like setenv:
      # setattr(mod, "LIMIT", 3) or setattr("pkg.mod.LIMIT", 3).
      not:
        has:
          field: arguments
          any:
            - all:
                - has: { nthChild: 2, kind: string, regex: '^[rRuU]?["''][A-Z][A-Z0-9_]*["'']$' }
                - has: { nthChild: 3, matches: literal }
            - all:
                - has: { nthChild: 1, kind: string, regex: '^[rRuU]?["''][\w.]+\.[A-Z][A-Z0-9_]*["'']$' }
                - has: { nthChild: 2, matches: literal }

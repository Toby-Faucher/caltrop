id: no-test-swap
language: rust
severity: error
message: "Production code must behave the same under test. Pass the dependency in instead."
ignores:
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
rule:
  all:
    - any:
        - kind: macro_invocation
          regex: '^cfg!\((.*[(,\s])?test([),\s].*)?\)$'
        - kind: attribute_item
          regex: '^#\[cfg\(.*\bnot\(\s*test\s*\).*\)\]$'
    - not:
        matches: in-test-code

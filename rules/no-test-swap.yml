id: no-test-swap
language: rust
severity: error
message: "Production code must behave the same under test. Pass the dependency in instead."
ignores:
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
rule:
  all:
    - any:
        - kind: macro_invocation
          regex: '(?s)^cfg!\((.*[(,\s])?test([),\s].*)?\)$'
        - kind: attribute_item
          regex: '(?s)^#\[cfg\(.*\bnot\(\s*test\s*\).*\)\]$'
        # Test-only cargo features are the same swap: a feature name with a -/_ separated word test, mock, fake or stub.
        - kind: macro_invocation
          regex: '(?s)^cfg!\(.*feature\s*=\s*"([^"]*[-_])?(test|tests|testing|mock|mocks|fake|fakes|stub|stubs)([-_][^"]*)?"'
        - kind: attribute_item
          regex: '(?s)^#\[cfg\(.*feature\s*=\s*"([^"]*[-_])?(test|tests|testing|mock|mocks|fake|fakes|stub|stubs)([-_][^"]*)?"'
    - not:
        matches: in-test-code

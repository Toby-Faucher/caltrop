id: no-test-swap
language: rust
severity: error
message: "Production code must behave the same under test. Pass the dependency in instead."
ignores:
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
rule:
  all:
    - any:
        - kind: macro_invocation
          regex: '^cfg!\((.*[(,\s])?test([),\s].*)?\)$'
        - kind: attribute_item
          regex: '^#\[cfg\(.*\bnot\(\s*test\s*\).*\)\]$'
        # Test-only cargo features (test-push, test-support, mock-net, fake_clock) are the same swap.
        - kind: macro_invocation
          regex: '^cfg!\(.*feature\s*=\s*"[^"]*\b(test|mock|fake|stub)'
        - kind: attribute_item
          regex: '^#\[cfg\(.*feature\s*=\s*"[^"]*\b(test|mock|fake|stub)'
    - not:
        matches: in-test-code

id: no-ignored-test-ts
language: typescript
severity: error
message: "A skipped or todo test never runs in CI, and an expected-to-fail test (`.fails`, `.failing`, `test.fail`) passes while the code is broken. Make it run and pass (fixture, real dependency or a CI job), or delete it."
files:
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/e2e/**"
utils:
  modifier:
    regex: '^(it|test|describe|suite|bench|context|specify)(\.(describe|concurrent|sequential|serial|parallel|shuffle))*\.(skip|todo|fixme|fails|failing|fail)(\.(each|for))?$'
rule:
  kind: call_expression
  any:
    - has:
        field: function
        regex: '^x(it|test|describe|context|specify)$'
    - has:
        field: function
        all:
          - matches: modifier
          # An inverted test (vitest .fails, jest .failing, Playwright test.fail) is an xfail: flagged in every
          # form. Playwright's conditional test.fail(cond, ..) too, as no-ignored-test-py flags xfail(cond).
          - regex: '\.(todo|fails|failing|fail)\b|\.(each|for)$'
    # .skip/.fixme with no arguments, or with a test body after the title: unconditional.
    # A Playwright condition (test.skip(isCI, ..)) is no-silent-skip.
    - all:
        - has: { field: function, matches: modifier }
        - has:
            field: arguments
            any:
              - not: { has: { nthChild: 1 } }
              - has:
                  any: [ { kind: arrow_function }, { kind: function_expression } ]
                  not: { nthChild: 1 }

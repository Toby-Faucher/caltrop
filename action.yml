name: caltrop
description: Fail when tests take shortcuts that coding agents like.
inputs:
  dir:
    description: Repo directory to check, relative to the workspace.
    default: .
runs:
  using: composite
  steps:
    - run: pipx install ast-grep-cli==0.44.1
      shell: bash
    - run: '"$GITHUB_ACTION_PATH/caltrop" check "$DIR"'
      shell: bash
      env:
        DIR: ${{ inputs.dir }}

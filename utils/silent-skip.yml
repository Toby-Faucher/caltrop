id: silent-skip
language: rust
# An early return guarded by a failed or negated check for a prerequisite, or any `let .. else { return }`.
utils:
  early-return:
    kind: return_expression
    regex: '(?s)^return(\s+e?println!.*|\s+Ok\(\(\)\))?$'
    not:
      inside:
        kind: closure_expression
        stopBy:
          kind: function_item
  missing-check:
    any:
      - regex: '(?s)^let\s+(Err|None)\b'
      - all:
          - regex: '(?s)(^!|\.is_err\(\)|\.is_none\(\))'
          - regex: '\b(exists|is_file|is_dir|env::var|var_os|\w*available|\w*present|ready|installed|skip|UdpSocket|TcpListener|which|find_\w+)\b'
rule:
  any:
    - kind: if_expression
      all:
        - has:
            field: condition
            matches: missing-check
        - has:
            field: consequence
            has:
              stopBy: end
              matches: early-return
    - kind: let_declaration
      has:
        field: alternative
        has:
          stopBy: end
          matches: early-return
